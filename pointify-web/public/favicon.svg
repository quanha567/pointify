<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Primary Brand Gradient -->
    <linearGradient id="pointify-stem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Loop Accent Gradient -->
    <linearGradient id="pointify-loop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glowing Point Gradient -->
    <linearGradient id="pointify-point-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Card Surface Glow -->
    <linearGradient id="pointify-card-surface" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Depth Shadows -->
    <filter id="pointify-shadow" x="-20%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    <filter id="pointify-glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Card (Stem of 'P') -->
  <g filter="url(#pointify-shadow)">
    <rect x="16" y="14" width="22" height="72" rx="8" fill="url(#pointify-stem-grad)" />
    <!-- Glass Highlight on Stem -->
    <rect x="16" y="14" width="22" height="72" rx="8" fill="url(#pointify-card-surface)" />
    <!-- Micro Card Lines representing estimation deck -->
    <line x1="22" y1="24" x2="32" y2="24" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="32" x2="28" y2="32" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Upper Overlapping Card (Loop of 'P') -->
  <g filter="url(#pointify-shadow)">
    <path
      d="M34 14 H63 C76.8 14 88 25.2 88 39 C88 52.8 76.8 64 63 64 H34 V48 H61 C66 48 70 44 70 39 C70 34 66 30 61 30 H34 Z"
      fill="url(#pointify-loop-grad)"
    />
    <!-- Glass Highlight on Loop -->
    <path
      d="M34 14 H63 C76.8 14 88 25.2 88 39 C88 52.8 76.8 64 63 64 H34 V48 H61 C66 48 70 44 70 39 C70 34 66 30 61 30 H34 Z"
      fill="url(#pointify-card-surface)"
    />
  </g>

  <!-- Center Estimation Point (Luminous 'Point' in 'Pointify') -->
  <g filter="url(#pointify-glow)">
    <!-- Outer Aura -->
    <circle cx="53" cy="39" r="8" fill="#38BDF8" fill-opacity="0.3" />
    <!-- Core Point -->
    <circle cx="53" cy="39" r="5" fill="url(#pointify-point-grad)" />
    <!-- Spark Highlight -->
    <circle cx="51.5" cy="37.5" r="1.5" fill="#FFFFFF" />
  </g>
</svg>